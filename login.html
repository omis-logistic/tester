<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>Login - Cahaya Az Zahra Enterprise</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    /* Mobile-first styles */
    .login-page {
      width: 100%;
      padding: 1rem;
      animation: fadeIn 0.3s ease-in;
    }

    h1.login-header {
      font-size: 2.5rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 2rem;
      color: var(--gold);
      padding: 1rem;
      border-bottom: 3px solid var(--gold);
    }

    .login-container {
      background: rgba(0, 0, 0, 0.7);
      padding: 1.5rem;
      border-radius: 10px;
      width: 100%;
      margin: 0 auto;
      box-shadow: 0 0 15px rgba(197, 160, 71, 0.3);
    }

    /* Desktop overrides */
    body.desktop-view .login-container {
      max-width: 400px;
      padding: 2rem;
      margin: 2rem auto;
    }

    input {
      background: #333;
      border: 1px solid var(--gold);
      color: var(--text-light);
      font-size: 16px;
      margin: 1rem 0;
      width: 100%;
      padding: 12px;
      border-radius: 5px;
      transition: border-color 0.3s ease;
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 0.5rem 0;
      font-size: 16px;
      min-height: 44px;
      transition: all 0.3s ease;
    }

    .auth-links {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .secondary-btn {
      background: transparent !important;
      border: 1px solid var(--gold) !important;
      color: var(--gold) !important;
    }

    .secondary-btn:hover {
      background: var(--gold) !important;
      color: var(--dark-bg) !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile-specific adjustments */
    @media (max-width: 768px) {
      h1.login-header {
        font-size: 1.8rem;
        padding: 0.5rem;
      }
      
      body.mobile-view .login-container {
        padding: 1rem;
      }
      
      input {
        font-size: 16px;
        padding: 12px;
      }
    }

  body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.container {
  flex: 1;
}
  </style>
</head>
<body>
  <div class="login-page">
    <h1 class="login-header">CAHAYA AZ ZAHRA ENTERPRISE</h1>
    
    <div class="login-container">
      <div class="input-group">
        <input type="tel" 
               id="phone" 
               placeholder="Phone Number"
               pattern="^(673\d{7,}|60\d{9,})$" 
               required>
      </div>
      
      <div class="input-group">
        <input type="password" 
               id="password" 
               placeholder="Password" 
               required>
      </div>
      <div id="loginError" class="inline-error" style="display: none;"></div>
      <button onclick="handleLogin()" id="loginBtn">
        <div class="button-loader"></div>
        <span class="btn-text">LOGIN</span>
      </button>
      
      <div class="auth-links">
        <button onclick="showRegistration()">CREATE ACCOUNT</button>
        <button class="secondary-btn" onclick="showForgotPassword()">
          FORGOT PASSWORD?
        </button>
      </div>
    </div>
  </div>

  <!-- Error message container -->
  <div id="error-message" class="error-message" style="display: none;"></div>

  <script src="scripts/app.js"></script>
  <script>
    // EXACT Mark 1 login implementation
    function handleLogin() {
      const btn = document.getElementById('loginBtn');
      const originalHtml = btn.innerHTML;
      
      // Show loading state
      btn.innerHTML = '<div class="button-loader"></div> Processing...';
      btn.disabled = true;

      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;

      if (!validatePhone(phone)) {
        showError('Invalid phone number format');
        btn.innerHTML = originalHtml;
        btn.disabled = false;
        return;
      }

      const callbackName = `jsonp_${Date.now()}`;
      const script = document.createElement('script');
      
      // EXACTLY like Mark 1 - with crossorigin attribute
      script.crossOrigin = 'anonymous';
      script.src = `${CONFIG.GAS_URL}?action=processLogin&phone=${encodeURIComponent(phone)}&password=${encodeURIComponent(password)}&callback=${callbackName}`;

      window[callbackName] = (response) => {
        // Restore button state
        btn.innerHTML = originalHtml;
        btn.disabled = false;

        if (response.success) {
          console.log('TempPassword flag:', response.tempPassword);
          sessionStorage.setItem('userData', JSON.stringify({
            phone: response.phone,
            email: response.email,
            tempPassword: response.tempPassword
          }));
          localStorage.setItem('lastActivity', Date.now());
          
          window.location.href = response.tempPassword 
            ? 'password-reset.html?force=true'
            : 'dashboard.html?fresh=1';
        } else {
          document.getElementById('password').value = '';
          showError(response.message || 'Authentication failed');
        }
        
        // Cleanup - EXACTLY like Mark 1
        if (script.parentNode) {
          document.body.removeChild(script);
        }
        delete window[callbackName];
      };
      
      // Add error handler
      script.onerror = function() {
        btn.innerHTML = originalHtml;
        btn.disabled = false;
        showError('Network error. Please try again.');
        if (script.parentNode) {
          document.body.removeChild(script);
        }
        delete window[callbackName];
      };
      
      document.body.appendChild(script);
    }

    // ======== EXACT Mark 1 ENTER KEY HANDLING ========
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        handleLogin();
      }
    });

    document.getElementById('phone').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('password').focus();
      }
    });
    
    function showRegistration() {
      safeRedirect('register.html');
    }

    function showForgotPassword() {
      safeRedirect('forgot-password.html');
    }

    // EXACT Mark 1 validation function
    function validatePhone(phone) {
      const regex = /^(673\d{7,}|60\d{9,})$/;
      return regex.test(phone);
    }

    // EXACT Mark 1 error display
    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      if (errorDiv) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        setTimeout(() => {
          errorDiv.style.display = 'none';
        }, 5000);
      }
    }

    // EXACT Mark 1 redirect function
    function safeRedirect(path) {
      try {
        // Extract base path without query parameters
        const basePath = path.split('?')[0].split('#')[0];
        
        const allowedPaths = [
          'login.html', 'register.html', 'dashboard.html',
          'forgot-password.html', 'password-reset.html',
          'my-info.html', 'parcel-declaration.html', 'track-parcel.html',
          'billing-info.html', 'invoice.html'
        ];
        
        if (!allowedPaths.includes(basePath)) {
          throw new Error('Unauthorized path');
        }
        
        window.location.href = path;
      } catch (error) {
        console.error('Redirect error:', error);
        showError('Navigation failed. Please try again.');
      }
    }
  </script>
</body>
</html>
